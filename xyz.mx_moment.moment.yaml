id: xyz.mx_moment.moment
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: 5.15-24.08
command: moment
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
rename-icon: moment
rename-desktop-file: moment.desktop
rename-appdata-file: moment.metainfo.xml
cleanup:
  - /app/include
  - /app/lib/cmake
  - /app/bin/cairosvg
  - /app/bin/chardetect
  - /app/bin/futurize
  - /app/bin/jsonschema
  - /app/bin/pasteurize
  - /app/bin/pwiz.py

modules:

  - name: pyotherside
    buildsystem: qmake
    sources:
      - type: archive
        url: https://github.com/thp/pyotherside/archive/1.6.2.tar.gz
        sha256: 9afe075f165c78ec584892887a6411fe1476f2115cf3bba026105bde29292a4b
      - type: patch
        path: pyotherside.patch

  - name: olm
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://gitlab.matrix.org/matrix-org/olm/-/archive/3.2.16/olm-3.2.16.tar.gz
        sha256: 1e90f9891009965fd064be747616da46b232086fe270b77605ec9bda34272a68
        x-checker-data:
          type: anitya
          project-id: 29706
          stable-only: true
          url-template: https://gitlab.matrix.org/matrix-org/olm/-/archive/$version/olm-$version.tar.gz
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release

  - name: libzen
    subdir: Project/GNU/Library
    config-opts:
      - --enable-shared
      - --disable-static
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /lib/*.la
    sources:
      - type: archive
        url: https://mediaarea.net/download/source/libzen/0.4.39/libzen_0.4.39.tar.gz
        sha256: bbf877062227828ccca63d36af04a16789f3f1013e0c99f6dfd908bf5f2dbe43

  - name: libmediainfo
    subdir: Project/GNU/Library
    config-opts:
      - --enable-shared
      - --disable-static
      - --with-libcurl
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /lib/*.la
    sources:
      - type: archive
        url: https://mediaarea.net/download/source/libmediainfo/22.06/libmediainfo_22.06.tar.gz
        sha256: 527a6e26d5b44665c6d8ce784d7c855a8bdc3dbb9d785fbe70f544eebbe20487

  # required for python3-pyaudio
  - name: portaudio
    config-opts:
      - --disable-static
      - --without-oss
      - --without-jack
    sources:
      - type: archive
        url: http://www.portaudio.com/archives/pa_stable_v190600_20161030.tgz
        sha256: f5a21d7dcd6ee84397446fa1fa1a0675bb2e8a4a6dceb4305a8404698d8d1513
    cleanup:
      - /lib/pkgconfig
      - /include
      - '*.la'

  - python3-modules.json

  - name: moment
    buildsystem: qmake
    sources:
      - type: git
        url: https://gitlab.com/mx-moment/moment.git
        tag: v0.7.6
        commit: a727ac9db90f6c910543e1b59ad243ed521e4b37
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
